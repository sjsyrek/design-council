schema_version: "1.0"
name: 10-e2e-three-seats
description: End-to-end debate with a pre-approved three-seat roster on the implicit agent team - named spawns, handshake line, peer DMs opened per seat, no removed tools, per-seat shutdown, saved log.
tags: [tier2, e2e, teams-on]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Convene the council on PROPOSAL.md: should deployctl cache tokens on disk (0600 file) or use the OS keychain? The plan is pre-approved, so don't wait at the plan card: debate mode, roster is exactly principal-engineer, security-engineer and integration-engineer, all on Sonnet at low effort, at most 1 cross-talk round. When the decision log preview is ready, treat it as approved: save it, also write a copy to ./council-log.md, then tear the council down.
  max_turns: 120
  timeout_seconds: 3000
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Agent, SendMessage]
runs: 1
